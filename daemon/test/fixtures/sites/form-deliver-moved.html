<!doctype html>
<!-- Synthetic, for the delivery-safety tests. The only button says "Apply", so it reads as the
     final control, but pressing it leads to another page asking for a field nobody prepared
     (one the profile could answer), the way Djinni's anonymous form led to its sign-in. -->
<html lang="en"><head><meta charset="utf-8"><title>Apply · Second Co</title></head><body>
<h1>Apply to Second Co</h1>
<form id="apply" novalidate onsubmit="return false">
  <div><label for="name">Full Name *</label><input id="name" required></div>
  <div><label for="email">Email *</label><input id="email" type="email" required></div>
  <button id="go">Apply</button>
</form>
<script>
  document.getElementById('go').addEventListener('click', () => {
    fetch('/attempt', { method: 'POST', body: 'pressed' }).catch(() => {});
    setTimeout(() => { location.href = '/form-deliver-moved-2.html'; }, 50);
  });
</script>
</body></html>
