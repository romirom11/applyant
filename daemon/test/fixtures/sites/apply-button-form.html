<!doctype html>
<!-- Synthetic: the application form is shown only after pressing Apply. -->
<html lang="en"><head><meta charset="utf-8"><title>Staff Engineer · Acme</title></head>
<body>
<h1>Staff Engineer</h1>
<p>Acme is hiring a staff engineer.</p>
<button type="button" onclick="document.getElementById('apply').hidden = false">Apply for this job</button>
<form id="apply" action="/submitted" method="post" hidden>
  <label>Full name <input name="name" required></label>
  <label>Email <input type="email" name="email" required></label>
  <label>Resume <input type="file" name="resume"></label>
  <button type="submit">Submit application</button>
</form>
</body></html>
