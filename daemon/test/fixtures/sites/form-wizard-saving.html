<!doctype html>
<!-- Synthetic. Modelled on wizards that save each step as a server-side draft before showing
     the next one (Workday's "Save and Continue"): moving on needs a POST to succeed. Read
     blocks every write, so it must stop at step 1 with a note instead of sending the draft. -->
<html lang="en"><head><meta charset="utf-8"><title>Apply · Platform Engineer · Acme Corp</title>
<style>[hidden] { display: none !important; }</style>
</head><body>
<h1>Platform Engineer</h1>
<div id="errors" role="alert" hidden></div>
<form id="wizard" novalidate onsubmit="return false">
  <section data-step="1">
    <h2>My Information</h2>
    <label for="name">Full Name *</label><input id="name" required>
    <label for="mail">Email Address *</label><input id="mail" type="email" required>
  </section>
  <section data-step="2" hidden>
    <h2>Application Questions</h2>
    <label for="why">Why Acme? *</label><textarea id="why" required></textarea>
  </section>
  <button type="button" id="next">Save and Continue</button>
</form>
<script>
  document.getElementById('next').addEventListener('click', async () => {
    try {
      const res = await fetch('/save-step', { method: 'POST', body: JSON.stringify({ step: 1, name: document.getElementById('name').value }) });
      if (!res.ok) throw new Error('save failed');
      document.querySelector('[data-step="1"]').hidden = true;
      document.querySelector('[data-step="2"]').hidden = false;
      document.getElementById('next').textContent = 'Submit';
    } catch {
      const e = document.getElementById('errors');
      e.hidden = false;
      e.textContent = 'Something went wrong while saving. Please try again.';
    }
  });
</script>
</body></html>
