<!doctype html>
<!-- Synthetic, for phase 6 delivery tests. One step, standard fields the profile answers
     directly, plus a range slider ("Notice period, in weeks") that isn't one of the form
     engine's operable kinds (it reads as kind "unknown"): the deterministic pass can't fill it,
     so it's a field-scoped form_agent escalation. Submitting shows a confirmation in place. -->
<html lang="en"><head><meta charset="utf-8"><title>Apply · Widget Co</title></head><body>
<h1>Apply to Widget Co</h1>
<form id="apply" novalidate onsubmit="return false">
  <div><label for="name">Full Name *</label><input id="name" required></div>
  <div><label for="email">Email *</label><input id="email" type="email" required></div>
  <div><label for="phone">Phone</label><input id="phone" type="tel"></div>
  <div><label for="salary">Desired salary</label><input id="salary"></div>
  <div><label for="notice">Notice period, in weeks *</label>
    <input id="notice" type="range" min="0" max="12" value="0" required></div>
  <div><label for="resume">Resume *</label><input id="resume" type="file" required></div>
  <div><label><input type="checkbox" id="consent" required> I agree to the privacy policy *</label></div>
  <button id="submit">Submit application</button>
</form>
<div id="confirmation" hidden>Thanks — your application has been received.</div>
<script>
  window.__submitted = 0;
  document.getElementById('submit').addEventListener('click', () => {
    const required = document.querySelectorAll('#apply [required]');
    for (const el of required) {
      const empty = el.type === 'checkbox' ? !el.checked : el.type === 'file' ? el.files.length === 0 : !el.value;
      if (empty) return;
    }
    window.__submitted++;
    document.getElementById('apply').hidden = true;
    document.getElementById('confirmation').hidden = false;
    fetch('/submitted', { method: 'POST', body: 'ok' }).catch(() => {});
  });
</script>
</body></html>
