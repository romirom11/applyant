<!doctype html>
<!-- Synthetic: an application form served by the test at linkedin.com, with a captcha widget
     on the step. On LinkedIn this is a challenge: the platform pauses, no solver is asked. -->
<html lang="en"><head><meta charset="utf-8"><title>Apply | LinkedIn</title></head><body>
<h1>Apply to Guarded Co</h1>
<form id="apply" novalidate onsubmit="return false">
  <div><label for="name">Full Name *</label><input id="name" required></div>
  <div><label for="email">Email *</label><input id="email" type="email" required></div>
  <div class="g-recaptcha" data-sitekey="6LfTestLinkedInKey0000000000000000000000"></div>
  <button id="submit">Submit application</button>
</form>
</body></html>
