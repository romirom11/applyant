syntax = "proto3";

package applyant.v1;

import "google/protobuf/timestamp.proto";

// ApplyantService is the only contract between applyantd and its clients
// (the `applyant` CLI now, the macOS app and Share extension later).
// Every call carries `Authorization: Bearer <token>` from the endpoint file.
service ApplyantService {
  // AddPosting records a posting at stage FOUND and enqueues its verification.
  // A URL that is already known returns the existing posting.
  rpc AddPosting(AddPostingRequest) returns (AddPostingResponse);
  rpc ListPostings(ListPostingsRequest) returns (ListPostingsResponse);
  rpc GetPosting(GetPostingRequest) returns (GetPostingResponse);
  // SkipPosting records the candidate's skip (with a reason) as feedback and re-scores.
  rpc SkipPosting(SkipPostingRequest) returns (SkipPostingResponse);
  // MarkInterested records interest (undoing a skip) as feedback and re-scores.
  rpc MarkInterested(MarkInterestedRequest) returns (MarkInterestedResponse);
  // ScorePostings enqueues score_posting; cached extractions and matches are reused.
  rpc ScorePostings(ScorePostingsRequest) returns (ScorePostingsResponse);
  // ReadForms enqueues read_form: the posting's application form is read (again), read-only.
  rpc ReadForms(ReadFormsRequest) returns (ReadFormsResponse);

  // Preferences drive the score; every change re-scores cached postings (no model calls).
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);
  rpc SetPreference(SetPreferenceRequest) returns (SetPreferenceResponse);

  // ListEvents returns stored events, newest last.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // WatchEvents streams events as they happen: task progress and posting stage changes.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);

  // Secrets are write-only from clients: values are never returned.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // GetSetupStatus says whether the daemon can do its work on this machine: where the agent
  // CLIs were found (a launchd agent has no shell PATH), whether they're signed in, and which
  // Apple-only parts are reachable. The menu bar, `applyant status` and onboarding read it.
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse);
  // Onboarding (phase 16): a setup step done, skipped or left for later. Finishing Preferences
  // starts search: the planner runs once when nothing searches yet.
  rpc SetSetupStep(SetSetupStepRequest) returns (SetSetupStepResponse);
  // Preferences pre-filled from the imported CV's facts, for the candidate to adjust and confirm
  // (each value is what SetPreference takes).
  rpc GetPreferencesDraft(GetPreferencesDraftRequest) returns (GetPreferencesDraftResponse);

  // Candidate knowledge: profile, projects, sources and the facts extracted from them.
  rpc GetCandidate(GetCandidateRequest) returns (GetCandidateResponse);
  rpc SetProfileValue(SetProfileValueRequest) returns (SetProfileValueResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // UpdateProject renames a project or changes what it says (summary, role, period, stack).
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  // DeleteProject removes a project with its sources, facts and interview questions.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // AddSource records a source and enqueues its first sync.
  rpc AddSource(AddSourceRequest) returns (AddSourceResponse);
  // SyncSources enqueues a sync of every matching source.
  rpc SyncSources(SyncSourcesRequest) returns (SyncSourcesResponse);
  // DeleteSource removes one source with its evidence; facts only it supported go too.
  rpc DeleteSource(DeleteSourceRequest) returns (DeleteSourceResponse);
  rpc ListFacts(ListFactsRequest) returns (ListFactsResponse);
  // ConfirmFact marks facts as true in the candidate's own judgement.
  rpc ConfirmFact(ConfirmFactRequest) returns (ConfirmFactResponse);
  // EditFact replaces a fact's text with the candidate's words, which confirms it.
  rpc EditFact(EditFactRequest) returns (EditFactResponse);
  // RejectFact marks a fact as untrue; a re-sync won't bring it back.
  rpc RejectFact(RejectFactRequest) returns (RejectFactResponse);

  // The agent interview: questions about each project's gaps (own role, what the candidate
  // built, team, impact), and the facts applications found missing. Answers become confirmed
  // facts; an answered application question prepares its application again.
  // ListInterview returns what waits on the candidate (or every question) and each project's gaps.
  rpc ListInterview(ListInterviewRequest) returns (ListInterviewResponse);
  // GetInterview returns one thread: a project's interview, or an application question's.
  rpc GetInterview(GetInterviewRequest) returns (GetInterviewResponse);
  // StartInterview returns the open question for a project (or, with no project, whatever is
  // next), or asks the interviewer for one (`pending`; an `interview` event follows).
  rpc StartInterview(StartInterviewRequest) returns (StartInterviewResponse);
  // AnswerInterviewQuestion stores the candidate's answer; the interviewer then saves its facts
  // and may ask a follow-up (`interview` events follow).
  rpc AnswerInterviewQuestion(AnswerInterviewQuestionRequest) returns (AnswerInterviewQuestionResponse);
  // DismissInterviewQuestion: "later". An application question is then left to the candidate
  // to answer in review.
  rpc DismissInterviewQuestion(DismissInterviewQuestionRequest) returns (DismissInterviewQuestionResponse);

  // Applications: one per posting, prepared for its real form, reviewed, then approved.
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  // GetApplication returns everything review shows: every field with its value and where it
  // came from, every answer sentence with its facts and flags, and what still blocks approve.
  rpc GetApplication(GetApplicationRequest) returns (GetApplicationResponse);
  // PrepareApplication starts the posting's application, or prepares it again: standard fields
  // from the current profile (per-application overrides stay), missing answers drafted.
  rpc PrepareApplication(PrepareApplicationRequest) returns (PrepareApplicationResponse);
  // SetFieldValue sets one field's value for this application only (the profile is untouched),
  // or clears that override so the prepared value applies again.
  rpc SetFieldValue(SetFieldValueRequest) returns (SetFieldValueResponse);
  // EditAnswer rewrites a sentence or a whole answer in the candidate's words (saved as
  // confirmed review_edit facts), or confirms a flagged sentence as true as written.
  rpc EditAnswer(EditAnswerRequest) returns (EditAnswerResponse);
  // RedraftAnswer is a review quick action: one written answer is drafted again, shorter
  // and/or from a chosen project's facts, under the same citation rules and checks. The
  // application prepares again (an `application` event follows); the other answers stay.
  rpc RedraftAnswer(RedraftAnswerRequest) returns (RedraftAnswerResponse);
  // ApproveApplication is refused (FailedPrecondition, listing why) while a required value is
  // missing, a sentence is flagged or unchecked, or a relied-on fact is unconfirmed. Approval
  // enqueues delivery through the application's channel; the candidate isn't asked again unless
  // delivery gets stuck.
  rpc ApproveApplication(ApproveApplicationRequest) returns (ApproveApplicationResponse);
  // SubmitApplication approves the application if it isn't yet (same refusal rules), then
  // (re-)enqueues delivery either way: also how to retry a delivery stuck on a hand-off.
  rpc SubmitApplication(SubmitApplicationRequest) returns (SubmitApplicationResponse);
  // SetApplyForm switches the application between the platform's form (LinkedIn Easy Apply,
  // Xing apply) and the company's own form, before approval. The form is read again from the new
  // target and the application prepared again for it (FailedPrecondition when the posting has
  // no such form, or the application is already approved).
  rpc SetApplyForm(SetApplyFormRequest) returns (SetApplyFormResponse);
  // MarkSubmitted records that the candidate finished a hand-off in the browser and pressed
  // submit themselves: the application becomes APPLIED with a receipt of the prepared values.
  rpc MarkSubmitted(MarkSubmittedRequest) returns (MarkSubmittedResponse);
  // GetHandOff returns the most recent delivery hand-off still waiting on the candidate, if any.
  rpc GetHandOff(GetHandOffRequest) returns (GetHandOffResponse);
  // SetCvMode sends the tailored CV (the default) or the profile's base CV for one application.
  rpc SetCvMode(SetCvModeRequest) returns (SetCvModeResponse);
  // EditCv rewrites one line of the tailored CV in the candidate's words (saved as a confirmed
  // review_edit fact; a left-out line given words goes back in), or removes it. The PDF is
  // rendered again.
  rpc EditCv(EditCvRequest) returns (EditCvResponse);
  // SetApplicationStage corrects an application's status by hand (PRD: "every status can be
  // corrected by hand"): APPLIED (sent outside Applyant, or a wrong reply undone), INTERVIEW,
  // OFFER, REJECTED or WITHDRAWN. Recorded as a manual `application.stage` event. It never
  // delivers anything; moves that can't be true are refused (FailedPrecondition, saying why):
  // a reply stage before the application was sent, a stage only the pipeline sets (preparing,
  // review, approved), or while a delivery is under way.
  rpc SetApplicationStage(SetApplicationStageRequest) returns (SetApplicationStageResponse);

  // Search: strategies (which sources, which queries, how often) find postings on their own.
  // Every source can be switched off, one by one or a whole kind; a source that's off is never
  // queried. ListSearch returns everything the Search screen shows: strategies with their
  // found / verified / interested counts, sources with theirs, and the kind switches.
  rpc ListSearch(ListSearchRequest) returns (ListSearchResponse);
  // AddStrategy adds a strategy; an active one runs right away, then on its schedule.
  rpc AddStrategy(AddStrategyRequest) returns (AddStrategyResponse);
  // UpdateStrategy changes what's set in the request: name, queries, locations, sources,
  // schedule, or state (pause / resume).
  rpc UpdateStrategy(UpdateStrategyRequest) returns (UpdateStrategyResponse);
  rpc DeleteStrategy(DeleteStrategyRequest) returns (DeleteStrategyResponse);
  // RunStrategy starts a run now, outside the schedule (unless one is waiting or running).
  rpc RunStrategy(RunStrategyRequest) returns (RunStrategyResponse);
  // AddSearchSource adds a company's ATS board, or a career page / feed URL.
  rpc AddSearchSource(AddSearchSourceRequest) returns (AddSearchSourceResponse);
  // SetSearchSourceEnabled switches a source (by key) or a whole kind (greenhouse, board, …).
  rpc SetSearchSourceEnabled(SetSearchSourceEnabledRequest) returns (SetSearchSourceEnabledResponse);
  // ListSearchRuns returns recent runs, newest first, each with what every source gave.
  rpc ListSearchRuns(ListSearchRunsRequest) returns (ListSearchRunsResponse);
  // PlanSearch starts the search planner (search_planner, Codex by default): it proposes
  // strategies from the profile (added active, marked agent-generated) and finds company boards
  // with web search (added to the watch list). Once run, it runs again weekly by itself.
  rpc PlanSearch(PlanSearchRequest) returns (PlanSearchResponse);
  // GetSearchSource returns one source with its listing recipe and what the recipe read from
  // the page it was built on.
  rpc GetSearchSource(GetSearchSourceRequest) returns (GetSearchSourceResponse);
  // RebuildRecipe asks reader_builder for a new listing recipe for a career page now.
  rpc RebuildRecipe(RebuildRecipeRequest) returns (RebuildRecipeResponse);

  // Model roles: which provider and model answer each role. Changes apply to the next run.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  // SetRole routes a role to "claude", "codex", "claude:sonnet", "jev" (decisions only), …
  rpc SetRole(SetRoleRequest) returns (SetRoleResponse);
  // ResetRoles puts one role (or every role) back on its default route.
  rpc ResetRoles(ResetRolesRequest) returns (ResetRolesResponse);

  // Companies: one research profile per company (researcher, Codex by default, with web
  // search), shared by all of its postings. It runs as part of preparing an application and
  // on demand; a profile is reused for 30 days. Red flags feed the score as a soft component.
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  // GetCompany returns one company's profile with every finding and its sources.
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  // ResearchCompany starts research now (Company research): kept when fresh unless refresh.
  rpc ResearchCompany(ResearchCompanyRequest) returns (ResearchCompanyResponse);

  // Mailbox: one connected mailbox (Gmail through Google's consent, or IMAP + SMTP) tracks
  // replies, reads emailed security codes during delivery and sends email applications.
  // ConnectMailbox for Gmail returns the consent URL to open; the mailbox is `connecting`
  // until the browser comes back.
  rpc ConnectMailbox(ConnectMailboxRequest) returns (ConnectMailboxResponse);
  rpc GetMailbox(GetMailboxRequest) returns (GetMailboxResponse);
  // DisconnectMailbox forgets the mailbox: an open Google consent is cancelled, the row and its
  // stored emails go, and so do its credentials (the Google tokens, the IMAP password). The
  // Google client secret stays, so connecting again needs only the consent.
  rpc DisconnectMailbox(DisconnectMailboxRequest) returns (DisconnectMailboxResponse);
  // SyncMailbox reads new mail now instead of at the next interval.
  rpc SyncMailbox(SyncMailboxRequest) returns (SyncMailboxResponse);
  // ListMailQueue is the "Which application is this?" queue.
  rpc ListMailQueue(ListMailQueueRequest) returns (ListMailQueueResponse);
  // AssignEmail answers it: an application (and optionally what the email is), or none.
  rpc AssignEmail(AssignEmailRequest) returns (AssignEmailResponse);

  // Guarded platforms (LinkedIn, Xing): daily caps, the pause after a challenge, and the
  // one-time sign-in in Applyant's browser profile. Captcha solving is `SetSecret capmonster`.
  rpc ListPlatforms(ListPlatformsRequest) returns (ListPlatformsResponse);
  // SetPlatformCaps sets a platform's daily caps (an unset field keeps its value).
  rpc SetPlatformCaps(SetPlatformCapsRequest) returns (SetPlatformCapsResponse);
  // ResumePlatform ends the pause after the candidate answered a challenge.
  rpc ResumePlatform(ResumePlatformRequest) returns (ResumePlatformResponse);
  // SignIn opens Applyant's profile in plain Chrome (no automation) at a platform's sign-in
  // page or any URL; returns once the window is open. Deliveries wait until it's closed.
  rpc SignIn(SignInRequest) returns (SignInResponse);

  // Telegram: the candidate's own account (GramJS, the session kept in Secrets) reads private
  // job channels and sends Telegram applications. Public channels need no account (their t.me/s
  // preview). Signing in is phone → code → the 2FA password when the account has one; each
  // call returns the state it leads to. Disconnect only forgets Applyant's session.
  rpc GetTelegram(GetTelegramRequest) returns (GetTelegramResponse);
  rpc ConnectTelegram(ConnectTelegramRequest) returns (ConnectTelegramResponse);
  rpc DisconnectTelegram(DisconnectTelegramRequest) returns (DisconnectTelegramResponse);

  // Overview: the funnel (found → verified → interested → prepared → approved → applied →
  // interview → offer) and the PRD's success metrics, computed from the job and application
  // history over a window.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
}

enum PostingStage {
  POSTING_STAGE_UNSPECIFIED = 0;
  POSTING_STAGE_FOUND = 1;
  POSTING_STAGE_VERIFIED = 2;
  POSTING_STAGE_FAILED_VERIFICATION = 3;
  POSTING_STAGE_SCORED = 4;
  POSTING_STAGE_SKIPPED = 5;
  // Was live and isn't any more: gone from a source's complete list, or re-verified dead.
  POSTING_STAGE_CLOSED = 6;
}

message Posting {
  int64 id = 1;
  PostingStage stage = 2;
  string canonical_url = 3;
  optional string title = 4;
  optional string company = 5;
  google.protobuf.Timestamp first_seen_at = 6;
  optional google.protobuf.Timestamp verified_at = 7;
  // Why verification decided what it did, e.g. "apply form on page" or "HTTP 404".
  optional string verify_note = 8;
  // Only filled by GetPosting.
  repeated PostingSource sources = 9;

  // 0–100, computed by the pure score() from the cached extraction and matches.
  optional int32 score = 10;
  // One component per key (must, nice, role, location, remote, salary, language, employment).
  repeated ScoreComponent breakdown = 11;
  // The candidate's own dealbreakers this posting hits. They never zero the score.
  repeated string dealbreakers = 12;
  optional google.protobuf.Timestamp scored_at = 13;
  // Why the last scoring attempt failed.
  optional string score_note = 14;
  // interested | skipped
  optional string decision = 15;
  optional string decision_reason = 16;
  // One sentence on the role, from the extractor.
  optional string summary = 17;
  // Only filled by GetPosting: each requirement with its verdict and supporting facts.
  repeated RequirementMatch requirements = 18;
  // The salary as the posting states it.
  optional string salary_text = 19;
  // must-haves × role fit, 0–1. Below 0.7 the logistics components count less.
  optional double core_fit = 20;
  // Fields the page's structured data (JSON-LD) decided over the extractor's reading.
  repeated string structured_fields = 21;
  // Where verification found the way to apply: the form page, an apply link's target, mailto:.
  optional string apply_url = 22;
  // verified | no_form | email | failed; unset until the form has been read.
  optional string form_status = 23;
  // What the read found ("1 step · 17 fields (9 required)") or why it failed.
  optional string form_note = 24;
  optional google.protobuf.Timestamp form_read_at = 25;
  // Only filled by GetPosting: the application form as Read found it.
  optional ApplicationForm form = 26;
  // The posting's application, once there is one.
  optional int64 application_id = 27;
  ApplicationStage application_stage = 28;
  // Only filled by GetPosting: the company's research (without its sections), once asked for.
  optional Company company_research = 29;
}

// How to find a form control again: getByRole(role, {name, exact}).nth(nth) inside the
// frames given by `frame` (iframe selectors, top page first), or `css` when set.
message ElementRef {
  repeated string frame = 1;
  string role = 2;
  string name = 3;
  int32 nth = 4;
  optional string css = 5;
}

message RevealedBy {
  ElementRef ref = 1;
  // The option (or "checked") that revealed the field; "*" = any answer; "add" = a field of an
  // entry of the repeatable group `ref`.
  string value = 2;
}

message FormField {
  ElementRef ref = 1;
  string label = 2;
  // text | textarea | select | combobox | radio | checkbox | file | date | group | unknown
  // (group: a repeatable section; ref adds an entry, whose fields have revealed_by value "add")
  string kind = 3;
  // Required whenever shown (for a conditional field: on its revealed_by branch only).
  bool required = 4;
  repeated string options = 5;
  // False when the field has no fixed options (free text, or options that load as you type).
  bool has_options = 6;
  // What the field asks for (field_classify): email, work_authorization, question, …
  optional string meaning = 7;
  // Set for conditional fields.
  optional RevealedBy revealed_by = 8;
}

message FormStep {
  repeated FormField fields = 1;
  // The control that moves on (or submits, when is_final).
  optional ElementRef advance = 2;
  // The advance control submits the application; Read never presses it.
  bool is_final = 3;
}

message ApplicationForm {
  // Where the form was read.
  string url = 1;
  repeated FormStep steps = 2;
  // What Read couldn't do or noticed.
  repeated string notes = 3;
}

message ScoreComponent {
  // must | nice | role | location | remote | salary | language | employment
  string key = 1;
  // Effective weight; 0 when no preference applies.
  double weight = 2;
  // 0–1.
  double value = 3;
  optional string note = 4;
  // The posting doesn't say enough: shown, not counted.
  bool uncertain = 5;
  // Share of weight·value that counts: below 1 for logistics when core fit is poor.
  double scale = 6;
}

message MatchedFact {
  int64 id = 1;
  string text = 2;
  FactStatus status = 3;
  optional string project_slug = 4;
}

message RequirementMatch {
  string text = 1;
  bool must = 2;
  // strong | partial | missing | unknown (a condition to ask the candidate about)
  string verdict = 3;
  repeated int64 fact_ids = 4;
  optional string note = 5;
  // The cited facts (GetPosting only).
  repeated MatchedFact facts = 6;
}

message PostingSource {
  // manual | share | greenhouse | ashby | lever | workable | page | board
  string kind = 1;
  string url = 2;
  google.protobuf.Timestamp first_seen_at = 3;
  // The search source that lists it (board:hn, greenhouse:gitlab); unset for manual ones.
  optional string search_source = 4;
  optional google.protobuf.Timestamp last_seen_at = 5;
  // Its complete list no longer has it.
  optional google.protobuf.Timestamp closed_at = 6;
}

message AddPostingRequest {
  string url = 1;
}

message AddPostingResponse {
  Posting posting = 1;
  // False when the URL was already known.
  bool created = 2;
}

message ListPostingsRequest {
  // Unspecified lists every stage.
  PostingStage stage = 1;
  // Highest score first (unscored last) instead of newest first.
  bool by_score = 2;
}

message ListPostingsResponse {
  repeated Posting postings = 1;
}

message GetPostingRequest {
  int64 id = 1;
}

message GetPostingResponse {
  Posting posting = 1;
}

message SkipPostingRequest {
  int64 id = 1;
  // Free text, e.g. "salary too low"; it decides which weight the feedback nudges.
  string reason = 2;
}

message SkipPostingResponse {
  Posting posting = 1;
  // Postings whose score changed with the nudged weights.
  int32 rescored = 2;
}

message MarkInterestedRequest {
  int64 id = 1;
}

message MarkInterestedResponse {
  Posting posting = 1;
  int32 rescored = 2;
}

message ScorePostingsRequest {
  // Empty: every verified or scored posting.
  repeated int64 ids = 1;
  // Re-read the page and re-extract; matches are still reused where nothing changed.
  bool refresh = 2;
}

message ScorePostingsResponse {
  repeated int64 enqueued_ids = 1;
}

message ReadFormsRequest {
  // Empty: every live posting whose form was never read.
  repeated int64 ids = 1;
}

message ReadFormsResponse {
  repeated int64 enqueued_ids = 1;
}

message Money {
  double amount = 1;
  // ISO 4217
  string currency = 2;
  // month | year
  string period = 3;
}

message Preferences {
  // Role families: ai_ml, backend, fullstack, frontend, data, platform, mobile, security,
  // founding, management, research, other. Empty = any.
  repeated string roles = 1;
  repeated string seniority = 2;
  optional string based_in = 3;
  repeated string locations = 4;
  // required | preferred | any
  string remote = 5;
  optional Money salary = 6;
  optional Money salary_floor = 7;
  // ISO 639-1 → A1…C2 | native
  map<string, string> languages = 8;
  repeated string employment = 9;
  repeated string dealbreakers = 10;
  // Base weights per component.
  map<string, double> weights = 11;
  // Bounded feedback nudges per component (1 = none).
  map<string, double> feedback_multipliers = 12;
  int32 threshold = 13;
}

message GetPreferencesRequest {}

message GetPreferencesResponse {
  Preferences preferences = 1;
}

message SetPreferenceRequest {
  // roles | seniority | based_in | locations | remote | salary | salary_floor | languages |
  // employment | dealbreakers | threshold | weight.<component> | weights
  string key = 1;
  // Lists are comma-separated; empty resets the key ("reset" for weights).
  string value = 2;
}

message SetPreferenceResponse {
  Preferences preferences = 1;
  // Postings whose score changed.
  int32 rescored = 2;
}

enum TaskEventType {
  TASK_EVENT_TYPE_UNSPECIFIED = 0;
  TASK_EVENT_TYPE_QUEUED = 1;
  TASK_EVENT_TYPE_STARTED = 2;
  TASK_EVENT_TYPE_PROGRESS = 3;
  TASK_EVENT_TYPE_DONE = 4;
  TASK_EVENT_TYPE_RETRY = 5;
  TASK_EVENT_TYPE_FAILED = 6;
  TASK_EVENT_TYPE_PROVIDER_PAUSED = 7;
  TASK_EVENT_TYPE_NEEDS_CANDIDATE = 8;
  TASK_EVENT_TYPE_LEASE_LOST = 9;
  TASK_EVENT_TYPE_REQUEUED = 10;
}

message TaskEvent {
  int64 task_id = 1;
  // verify_posting, ...
  string task_kind = 2;
  int64 entity_id = 3;
  TaskEventType type = 4;
  int32 attempts = 5;
}

message PostingEvent {
  int64 posting_id = 1;
  PostingStage stage = 2;
}

message ApplicationEvent {
  int64 application_id = 1;
  int64 posting_id = 2;
  ApplicationStage stage = 3;
  // A reply the mailbox read moved it (a mail sync), not the candidate or the pipeline: the app
  // notifies for these ("Helix invites you to …").
  bool from_mail = 4;
}

// Delivery got stuck and left a browser window open for the candidate to finish.
message HandOffEvent {
  int64 application_id = 1;
  int64 posting_id = 2;
  string reason = 3;
}

// A question was asked, an answer read, or the interviewer has nothing more to ask.
message InterviewEvent {
  // Unset when an interview couldn't start.
  optional int64 question_id = 1;
  // open | processing | answered | dismissed | done (nothing more to ask) | failed
  string status = 2;
}

// A search run was queued, finished or failed, a strategy changed, the planner ran, or a page's
// listing recipe was built.
message SearchEvent {
  // Unset when a strategy changed without a run.
  optional int64 run_id = 1;
  // 0 for planner and recipe events.
  int64 strategy_id = 2;
  // Runs and strategies: queued | done | failed | updated | deleted.
  // The planner: plan_queued | plan_done | plan_failed.
  // Recipes: recipe_building | recipe_built | recipe_failed.
  string status = 3;
  optional int64 plan_id = 4;
  optional int64 source_id = 5;
}

// Company research was queued, finished or failed.
message CompanyEvent {
  int64 company_id = 1;
  // queued | done | failed
  string status = 2;
}

message MailEvent {
  // synced · connected · failed · disconnected (entity = mailbox) · ask · assigned · calendar
  // (entity = email)
  string status = 1;
  int64 entity_id = 2;
}

// A guarded platform changed: paused | resumed | caps | signed_in | signing_in.
message PlatformEvent {
  string platform = 1;
  string status = 2;
}

message Event {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  optional int64 run_id = 3;
  // Human-readable, e.g. "HTTP 404" or "retry at 15:45: navigation timeout".
  string message = 4;
  oneof payload {
    TaskEvent task = 10;
    PostingEvent posting = 11;
    ApplicationEvent application = 12;
    HandOffEvent handoff = 13;
    InterviewEvent interview = 14;
    SearchEvent search = 15;
    CompanyEvent company = 16;
    MailEvent mail = 17;
    PlatformEvent platform = 18;
  }
}

message ListEventsRequest {
  // Only events of this run.
  optional int64 run_id = 1;
  // Only events about this posting.
  optional int64 posting_id = 2;
  // At most this many of the newest events; 0 means 100.
  int32 limit = 3;
}

message ListEventsResponse {
  repeated Event events = 1;
}

message WatchEventsRequest {
  optional int64 run_id = 1;
  optional int64 posting_id = 2;
  // Stored events with a greater id are sent first, then live ones.
  // Unset: live events only.
  optional int64 after_event_id = 3;
}

message WatchEventsResponse {
  Event event = 1;
}

message SetSecretRequest {
  string name = 1;
  string value = 2;
}

message SetSecretResponse {}

message DeleteSecretRequest {
  string name = 1;
}

message DeleteSecretResponse {
  bool deleted = 1;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  repeated string names = 1;
}

// ---- Setup ----------------------------------------------------------------------------

message ToolStatus {
  bool found = 1;
  // Absolute path of the executable the daemon runs; empty when not found.
  string path = 2;
  // Which lookup step found it: "env" ($APPLYANT_<TOOL>_PATH), "dir" (a fixed directory) or
  // "shell" (the login shell's PATH); empty when not found.
  string found_via = 3;
  // `<tool> --version`; empty when it couldn't be run.
  string version = 4;
  bool signed_in = 5;
  // Why it's missing, can't run or isn't signed in; empty when all is well.
  string error = 6;
}

message SetupStatus {
  ToolStatus claude = 1;
  ToolStatus codex = 2;
  // applyant-native (macOS only) answers.
  bool native_helper = 3;
  // "keychain" | "file".
  string secrets_backend = 4;
  // The daemon itself: its process, data directory and start time.
  int64 pid = 5;
  string home = 6;
  google.protobuf.Timestamp started_at = 7;
  // When the tool checks above ran (they're cached for a minute).
  google.protobuf.Timestamp checked_at = 8;
  // Connections (phase 16 onboarding): what's set up, and what each says about itself.
  Connection jev = 9;
  Connection github = 10;
  Connection mailbox = 11;
  // Calendar and Drive come with a connected Google account (one consent).
  Connection calendar = 12;
  Connection drive = 13;
  Connection telegram = 14;
  Connection captcha = 15;
  // connections · import · preferences · interview, in that order.
  repeated SetupStep steps = 16;
  ImportProgress import = 17;
  // Preferences is done: search has started (or the candidate set it up by hand).
  bool search_started = 18;
  // Every step is done, skipped or left for later: the app stops showing the setup on launch.
  bool setup_done = 19;
}

message Connection {
  bool connected = 1;
  // "sk-…" never: what it is ("me@gmail.com", "romirom11"), or what it's for when missing.
  string detail = 2;
}

message SetupStep {
  // connections | import | preferences | interview
  string step = 1;
  // pending | done | skipped | later
  string state = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ImportProgress {
  int32 sources = 1;
  // Sources waiting for or in their sync.
  int32 syncing = 2;
  // Sources whose last sync failed (their note says why).
  int32 failed = 3;
  int32 projects = 4;
  int32 facts = 5;
}

message SetSetupStepRequest {
  string step = 1;
  // done | skipped | later | pending
  string state = 2;
}

message SetSetupStepResponse {
  SetupStatus status = 1;
  // The planner run this call started (finishing Preferences); 0 when none.
  int64 plan_id = 2;
}

message PreferenceSuggestion {
  // A SetPreference key: roles · seniority · based_in · languages · salary …
  string key = 1;
  // In SetPreference's form ("backend, ai_ml", "en:C1, el:native").
  string value = 2;
  // Why: the CV lines it comes from.
  string reason = 3;
  repeated int64 fact_ids = 4;
}

message GetPreferencesDraftRequest {}

message GetPreferencesDraftResponse {
  repeated PreferenceSuggestion suggestions = 1;
}

message GetSetupStatusRequest {
  // Re-run the tool checks instead of using the cached ones.
  bool refresh = 1;
}

message GetSetupStatusResponse {
  SetupStatus status = 1;
}

// ---- Candidate knowledge ------------------------------------------------------------

message ProfileEntry {
  string key = 1;
  // Lists (github_logins, commit_emails) have one value per entry.
  repeated string values = 2;
}

message Project {
  int64 id = 1;
  // Short handle for the CLI, e.g. "solovei".
  string slug = 2;
  string name = 3;
  optional string summary = 4;
  optional string role = 5;
  optional string period = 6;
  repeated string stack = 7;
  int32 source_count = 8;
  // Facts that are unconfirmed or confirmed (rejected ones are not counted).
  int32 fact_count = 9;
  int32 unconfirmed_count = 10;
  int32 confirmed_count = 11;
}

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_FILE = 1;
  SOURCE_KIND_URL = 2;
  SOURCE_KIND_GITHUB = 3;
  SOURCE_KIND_DRIVE = 4;
  SOURCE_KIND_MANUAL = 5;
}

message Source {
  int64 id = 1;
  // Unset for profile-level sources (a CV covering many projects).
  optional int64 project_id = 2;
  SourceKind kind = 3;
  // Absolute path (a folder ends in "/"), URL, https://github.com/<owner>/<repo>, or a Drive
  // file id ("folder:<id>" for a Drive folder).
  string locator = 4;
  optional google.protobuf.Timestamp last_synced_at = 5;
  // What the last sync did, or why it failed.
  optional string sync_note = 6;
  // A local folder or a Drive folder: every readable file in it is read.
  bool folder = 7;
}

enum FactStatus {
  FACT_STATUS_UNSPECIFIED = 0;
  FACT_STATUS_UNCONFIRMED = 1;
  FACT_STATUS_CONFIRMED = 2;
  FACT_STATUS_REJECTED = 3;
}

message Evidence {
  optional int64 source_id = 1;
  SourceKind source_kind = 2;
  string source_locator = 3;
  // Where inside the source: "page 2", "commit:1a2b3c4d5e6f", "pr:#12", "path:README.md".
  optional string locator = 4;
  // A short verbatim excerpt of the source.
  optional string excerpt = 5;
}

message Fact {
  int64 id = 1;
  optional int64 project_id = 2;
  optional string project_slug = 3;
  string text = 4;
  // personal_contribution | team_context | role | skill | impact | education | other
  string kind = 5;
  FactStatus status = 6;
  // extracted | interview | review_edit
  string origin = 7;
  repeated Evidence evidence = 8;
  optional google.protobuf.Timestamp edited_at = 9;
}

message GetCandidateRequest {}

message GetCandidateResponse {
  repeated ProfileEntry profile = 1;
  repeated Project projects = 2;
  // Sources that belong to no single project.
  repeated Source profile_sources = 3;
  int32 profile_fact_count = 4;
}

message SetProfileValueRequest {
  string key = 1;
  // Lists are comma- or space-separated; an empty value clears the key.
  string value = 2;
}

message SetProfileValueResponse {
  ProfileEntry entry = 1;
}

message CreateProjectRequest {
  string name = 1;
  // Derived from the name when unset.
  optional string slug = 2;
  optional string summary = 3;
  optional string role = 4;
  optional string period = 5;
  repeated string stack = 6;
}

message CreateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  // Id, slug or name.
  string ref = 1;
}

message GetProjectResponse {
  Project project = 1;
  repeated Source sources = 2;
}

message UpdateProjectRequest {
  // Id, slug or name.
  string project = 1;
  optional string name = 2;
  // Empty clears it.
  optional string summary = 3;
  optional string role = 4;
  optional string period = 5;
  // Set to replace.
  optional StringList stack = 6;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  // Id, slug or name.
  string project = 1;
}

message DeleteProjectResponse {
  // What went with it.
  int32 sources_removed = 1;
  int32 facts_removed = 2;
}

message AddSourceRequest {
  // Project id, slug or name; empty for a profile-level source.
  string project = 1;
  SourceKind kind = 2;
  string locator = 3;
}

message AddSourceResponse {
  Source source = 1;
  // False when the same source was already there (no sync is enqueued then).
  bool created = 2;
}

message SyncSourcesRequest {
  // A project ref, a source kind ("file", "url", "github"), "profile", "source:<id>" (one
  // source), or empty for all.
  string target = 1;
  // Re-extract even when a source hasn't changed since its last sync.
  bool force = 2;
}

message SyncSourcesResponse {
  repeated Source sources = 1;
  // Sources a sync was enqueued for (others already had one queued or running).
  repeated int64 enqueued_source_ids = 2;
}

message DeleteSourceRequest {
  int64 id = 1;
}

message DeleteSourceResponse {
  // Facts that had no evidence left and went with the source. Facts in the candidate's own
  // words (interview answers, edits) stay.
  int32 facts_removed = 1;
}

message ListFactsRequest {
  // Project ref; "profile" for profile-level facts; empty for all.
  string project = 1;
  FactStatus status = 2;
}

message ListFactsResponse {
  repeated Fact facts = 1;
}

message ConfirmFactRequest {
  repeated int64 ids = 1;
  // With an application: confirms the unconfirmed facts it relies on (all of them when `ids`
  // is empty; otherwise only those, which must be ones it relies on).
  optional int64 application_id = 2;
}

message ConfirmFactResponse {
  repeated Fact facts = 1;
}

message EditFactRequest {
  int64 id = 1;
  string text = 2;
}

message EditFactResponse {
  Fact fact = 1;
}

message RejectFactRequest {
  repeated int64 ids = 1;
}

message RejectFactResponse {
  repeated Fact facts = 1;
}

// ---- The interview ------------------------------------------------------------------------

message InterviewQuestion {
  int64 id = 1;
  // The project a project interview is about (unset for an application question).
  optional int64 project_id = 2;
  optional string project_slug = 3;
  optional string project_name = 4;
  // An application question: the application, its job ("Acme AI · Senior AI Engineer") and
  // the form question's field ref.
  optional int64 application_id = 5;
  optional string application = 6;
  optional string field_ref = 7;
  string text = 8;
  // Why it's asked: the gap, or for an application question what's missing.
  optional string context = 9;
  // open | processing (answered, being read) | answered | dismissed
  string status = 10;
  // project (opens a project's interview) | follow_up | application
  string origin = 11;
  // What reading the answer gave, or why it failed.
  optional string note = 12;
  google.protobuf.Timestamp created_at = 13;
  optional google.protobuf.Timestamp answered_at = 14;
  // The candidate's answer.
  optional string answer = 15;
  // Facts saved from the answer.
  repeated Fact facts = 16;
}

message ProjectInterview {
  Project project = 1;
  // What its facts don't show yet: personal_contribution | role | team | impact.
  repeated string gaps = 2;
  // Human-readable gaps, same order ("what the candidate personally built or did").
  repeated string gap_labels = 3;
  // Questions waiting on the candidate.
  int32 open = 4;
  // Questions asked so far.
  int32 asked = 5;
  // The interviewer is writing a question or reading an answer about it.
  bool busy = 6;
}

message ListInterviewRequest {
  // Every question, not only the open and processing ones.
  bool all = 1;
}

message ListInterviewResponse {
  // Application questions first, then project questions, oldest first.
  repeated InterviewQuestion questions = 1;
  repeated ProjectInterview projects = 2;
}

message GetInterviewRequest {
  oneof target {
    // Project id, slug or name.
    string project = 1;
    // Any question of the thread.
    int64 question_id = 2;
  }
}

message GetInterviewResponse {
  // The thread, oldest first, each question with its answer and saved facts.
  repeated InterviewQuestion questions = 1;
  // Set for a project's interview.
  optional ProjectInterview project = 2;
  // The interviewer is working on this thread.
  bool pending = 3;
}

message StartInterviewRequest {
  // Project id, slug or name; empty: whatever is next.
  string project = 1;
}

message StartInterviewResponse {
  // The question waiting for the candidate.
  optional InterviewQuestion question = 1;
  // The interviewer is writing one (or reading the last answer); an `interview` event follows.
  bool pending = 2;
  optional int64 project_id = 3;
  // "Nothing to ask …" or what is pending.
  string message = 4;
}

message AnswerInterviewQuestionRequest {
  int64 id = 1;
  string text = 2;
}

message AnswerInterviewQuestionResponse {
  InterviewQuestion question = 1;
}

message DismissInterviewQuestionRequest {
  int64 id = 1;
}

message DismissInterviewQuestionResponse {
  InterviewQuestion question = 1;
}

// ---- Applications -------------------------------------------------------------------------

enum ApplicationStage {
  APPLICATION_STAGE_UNSPECIFIED = 0;
  APPLICATION_STAGE_PREPARING = 1;
  APPLICATION_STAGE_READY_FOR_REVIEW = 2;
  // Something only the candidate can give: a value the profile lacks, a fact the knowledge
  // base lacks (see `note` and the missing fields).
  APPLICATION_STAGE_NEEDS_CANDIDATE = 3;
  APPLICATION_STAGE_APPROVED = 4;
  // Delivered through its channel; see `receipt`. A delivery stuck mid-way stays APPROVED
  // (the human gate already passed) with `note` and `hand_off` set.
  APPLICATION_STAGE_APPLIED = 5;
  // Moved on by replies read from the mailbox (or by the candidate's answer in the ask queue).
  APPLICATION_STAGE_INTERVIEW = 6;
  APPLICATION_STAGE_REJECTED = 7;
  APPLICATION_STAGE_OFFER = 8;
  // The candidate withdrew (set by hand only).
  APPLICATION_STAGE_WITHDRAWN = 9;
}

message ApplicationField {
  // 1-based position in the form (the CLI's #n).
  int32 number = 1;
  // Stable id of the field: "<step>:<control>".
  string ref = 2;
  int32 step = 3;
  string label = 4;
  // text | textarea | select | combobox | radio | checkbox | file | date | group | unknown
  string kind = 5;
  optional string meaning = 6;
  bool required = 7;
  repeated string options = 8;
  bool has_options = 9;
  // standard | question | group | entry | consent | eeo
  string role = 10;
  // What will be sent: text, an option, "checked"/"unchecked", a file path, or a JSON list
  // (several options; a group's entries).
  optional string value = 11;
  // profile | override | answer | file | rule | none
  string source = 12;
  // What preparation computed; applies again when an override is cleared.
  optional string default_value = 13;
  string default_source = 14;
  // Why there is no value, or how it was chosen.
  optional string note = 15;
  // The form will ask it: its branch (revealed_by) applies with the values as they are.
  bool active = 16;
  // Required, active and without a value.
  bool missing = 17;
  // For fields of a repeatable group's entry: the group's ref.
  optional string entry_of = 18;
  // "shown when "X" is "Yes"" for conditional fields.
  optional string condition = 19;
}

message AnswerSentence {
  int32 index = 1;
  string text = 2;
  repeated int64 fact_ids = 3;
  // none | unchecked | unconfirmed | rejected_fact | absent_number | contradiction |
  // verifier:<quantity|role|scope|timeframe|unsupported>
  string flag = 4;
  optional string note = 5;
  repeated MatchedFact facts = 6;
}

message Answer {
  // 1-based, in form order (the CLI's q1, q2, …).
  int32 number = 1;
  int64 id = 2;
  // The question's field ref.
  string field_ref = 3;
  string question = 4;
  // text (the sentences are sent) | choice (`choice` is sent; the sentences are its claim)
  string kind = 5;
  // answered | needs_candidate
  string status = 6;
  optional string choice = 7;
  // For needs_candidate: what the candidate has to tell.
  optional string missing = 8;
  // "answer:<id>" of a prior answer whose facts it reuses.
  optional string adapted_from = 9;
  bool edited = 10;
  bool active = 11;
  // The candidate set the field directly; this draft isn't used.
  bool overridden = 12;
  repeated AnswerSentence sentences = 13;
  // needs_candidate: the interview question asking the candidate for it (open or being read).
  optional int64 interview_question_id = 14;
  // The earlier answer it was adapted from: "adapted from the answer sent to Orbit (Sep 12)".
  optional AdaptedFrom adapted = 15;
  // A quick action waiting for the next draft ("Shorter", "Use another project…").
  bool redraft_shorter = 16;
  optional string redraft_project = 17;
}

message AdaptedFrom {
  int64 answer_id = 1;
  int64 application_id = 2;
  optional string company = 3;
  optional string title = 4;
  // That application's question.
  string question = 5;
  ApplicationStage stage = 6;
  // When it was sent, or else when that answer was drafted.
  google.protobuf.Timestamp at = 7;
}

message Application {
  int64 id = 1;
  int64 posting_id = 2;
  ApplicationStage stage = 3;
  // web_form | email
  string channel = 4;
  optional string note = 5;
  optional string title = 6;
  optional string company = 7;
  optional int32 score = 8;
  string posting_url = 9;
  optional string form_url = 10;
  google.protobuf.Timestamp created_at = 11;
  optional google.protobuf.Timestamp prepared_at = 12;
  optional google.protobuf.Timestamp approved_at = 13;
  // Why approve is refused; empty when it can be approved.
  repeated string blockers = 14;
  // What only the candidate can give.
  repeated string missing = 15;
  repeated int64 unconfirmed_fact_ids = 16;
  // Only filled by GetApplication (and the review RPCs).
  repeated ApplicationField fields = 17;
  repeated Answer answers = 18;
  optional google.protobuf.Timestamp applied_at = 19;
  // Set once delivery has submitted the application.
  optional Receipt receipt = 20;
  // The most recent delivery hand-off still waiting on the candidate, if any.
  optional HandOff hand_off = 21;
  // The CV its form takes; unset when the form takes none. Only filled by GetApplication.
  optional Cv cv = 22;
  // The company's research summary and red flags (no sections), for the evidence panel. Only
  // filled by GetApplication (and the review RPCs).
  optional Company company_research = 23;
  // The replies linked to it (newest first): rejection, interview invites, offer. Only filled
  // by GetApplication.
  repeated Email emails = 24;
  // The form it goes through: the company's own (the default) or the platform's.
  ApplyForm apply_form = 25;
  // Both forms are known, so the candidate can switch (SetApplyForm) before approval.
  bool apply_form_switchable = 26;
}

enum ApplyForm {
  APPLY_FORM_UNSPECIFIED = 0;
  APPLY_FORM_COMPANY = 1;
  APPLY_FORM_PLATFORM = 2;
}

message SetApplyFormRequest {
  int64 application_id = 1;
  ApplyForm form = 2;
}

message SetApplyFormResponse {
  Application application = 1;
}

message CvLine {
  // The CLI's handle: s1 (summary) · p2.3 (project 2, bullet 3) · e1 (education) · d4 (left out).
  string handle = 1;
  string text = 2;
  repeated int64 fact_ids = 3;
  repeated MatchedFact facts = 4;
}

message CvProject {
  int32 number = 1;
  string slug = 2;
  string name = 3;
  optional string period = 4;
  repeated CvLine bullets = 5;
}

message CvDroppedLine {
  CvLine line = 1;
  // summary | education | skills | a project slug
  string section = 2;
  string reason = 3;
}

// The application's CV: what the tailored one emphasises, or that the base CV is sent.
message Cv {
  // tailored | base
  string mode = 1;
  // pending | planned | ready | skipped (no tailored CV possible; the note says why)
  string status = 2;
  optional string note = 3;
  optional string pdf_path = 4;
  optional string pdf_hash = 5;
  optional google.protobuf.Timestamp rendered_at = 6;
  repeated CvLine summary = 7;
  // In the order the CV shows them: the tailoring.
  repeated CvProject projects = 8;
  repeated CvLine education = 9;
  repeated string skills = 10;
  repeated CvDroppedLine dropped = 11;
  // Handles of lines whose facts are no longer confirmed (these block approve).
  repeated string stale = 12;
}

message ReceiptFieldValue {
  string ref = 1;
  string label = 2;
  optional string value = 3;
  // profile | override | answer | file | rule | none
  string source = 4;
}

// Exactly what was sent when delivery submitted the application.
message Receipt {
  string final_url = 1;
  optional string confirmation_text = 2;
  optional string cv_path = 3;
  optional string cv_hash = 4;
  optional string salary_value = 5;
  google.protobuf.Timestamp submitted_at = 6;
  repeated ReceiptFieldValue field_values = 7;
}

// Why delivery needs the candidate, and (for a browser hand-off) where it got stuck.
message HandOff {
  string reason = 1;
  optional string detail = 2;
  // field | step | captcha
  optional string scope = 3;
  optional int32 step = 4;
  optional string field_label = 5;
  optional string url = 6;
  // A saved `ariaSnapshot` of the page at hand-off time.
  optional string snapshot_path = 7;
}

message ListApplicationsRequest {
  // Unspecified lists every stage.
  ApplicationStage stage = 1;
}

message ListApplicationsResponse {
  repeated Application applications = 1;
}

message GetApplicationRequest {
  int64 id = 1;
}

message GetApplicationResponse {
  Application application = 1;
}

message PrepareApplicationRequest {
  // One of the two: a posting (its application is created if it has none) or an application.
  optional int64 posting_id = 1;
  optional int64 application_id = 2;
  // Redraft every answer, not only missing ones, and write the tailored CV again (the
  // candidate's edits are redrafted too).
  bool rewrite = 3;
}

message PrepareApplicationResponse {
  Application application = 1;
  bool created = 2;
}

message RedraftAnswerRequest {
  int64 application_id = 1;
  // The answer's number (q3) or its field (#7, label, ref).
  string answer = 2;
  // "Shorter": about half as long, same facts and rules.
  bool shorter = 3;
  // "Use another project…": the project's slug, name or id.
  optional string project = 4;
}

message RedraftAnswerResponse {
  Application application = 1;
}

message SetFieldValueRequest {
  int64 application_id = 1;
  // The field's number (#3), meaning (salary), label or ref.
  string field = 2;
  string value = 3;
  // Clears this application's value: the prepared one (from the profile) applies again.
  bool clear = 4;
}

message SetFieldValueResponse {
  Application application = 1;
  ApplicationField field = 2;
}

message EditAnswerRequest {
  int64 application_id = 1;
  // q2, 2, or the question field's number / label.
  string answer = 2;
  // 0-based sentence; unset = the whole answer.
  optional int32 sentence = 3;
  // The candidate's words. Unset (with `sentence`) confirms that sentence as written.
  optional string text = 4;
}

message EditAnswerResponse {
  Application application = 1;
  Answer answer = 2;
  // Facts saved from the candidate's words (confirmed, origin review_edit).
  repeated int64 fact_ids = 3;
}

message ApproveApplicationRequest {
  int64 id = 1;
}

message ApproveApplicationResponse {
  Application application = 1;
}

message SubmitApplicationRequest {
  int64 id = 1;
}

message SubmitApplicationResponse {
  Application application = 1;
}

message SetApplicationStageRequest {
  int64 application_id = 1;
  ApplicationStage stage = 2;
}

message SetApplicationStageResponse {
  Application application = 1;
}

message MarkSubmittedRequest {
  int64 application_id = 1;
}

message MarkSubmittedResponse {
  Application application = 1;
}

message GetHandOffRequest {
  int64 application_id = 1;
}

message GetHandOffResponse {
  optional HandOff hand_off = 1;
}

message SetCvModeRequest {
  int64 application_id = 1;
  // tailored | base
  string mode = 2;
}

message SetCvModeResponse {
  Application application = 1;
}

message EditCvRequest {
  int64 application_id = 1;
  // s1 · p2.3 · e1 · d4 (see Cv).
  string line = 2;
  // The candidate's words; unset removes the line.
  optional string text = 3;
}

message EditCvResponse {
  Application application = 1;
  // The fact saved from the candidate's words, when there were words.
  optional int64 fact_id = 2;
}

// ---- Search -------------------------------------------------------------------------------

// What a strategy or source found, and how the candidate took it.
message SearchStats {
  // Postings it listed (each counted once).
  int32 found = 1;
  // …that passed verification at some point.
  int32 verified = 2;
  // …that the candidate marked interested / skipped.
  int32 interested = 3;
  int32 skipped = 4;
}

message SearchStrategy {
  int64 id = 1;
  string name = 2;
  // Title phrases: a listing matches when every word of one is in its title ("-word" excludes).
  // Empty: every listing.
  repeated string queries = 3;
  // Location words ("remote" matches remote jobs); empty: anywhere.
  repeated string locations = 4;
  // Source selectors: all, a kind (greenhouse, board, …) or a source key (board:hn).
  repeated string sources = 5;
  int32 every_minutes = 6;
  // active | paused
  string state = 7;
  // candidate | agent
  string origin = 8;
  optional google.protobuf.Timestamp last_run_at = 9;
  google.protobuf.Timestamp next_run_at = 10;
  optional string note = 11;
  SearchStats stats = 12;
  optional SearchRun last_run = 13;
  // The sources a run would query now: selected and switched on.
  repeated string source_keys = 14;
  // A run is waiting or running.
  bool running = 15;
  // How often it actually runs: longer than every_minutes when few of its postings were
  // interesting (a weak strategy runs less often; it's never paused or removed on its own).
  int32 effective_every_minutes = 16;
  // Why it runs less often; unset when it doesn't.
  optional string cadence_note = 17;
}

message SearchSource {
  int64 id = 1;
  // <kind>:<locator>, e.g. greenhouse:gitlab · board:hn · page:https://acme.com/careers
  string key = 2;
  // greenhouse | ashby | lever | workable | page | board
  string kind = 3;
  string locator = 4;
  string label = 5;
  bool enabled = 6;
  // Its kind is switched on (a source is queried only when both are on).
  bool kind_enabled = 7;
  // Gives its whole list, so a posting missing from it is closed (boards don't).
  bool complete_list = 8;
  // builtin | candidate | agent
  string origin = 9;
  optional google.protobuf.Timestamp last_run_at = 10;
  optional int32 last_count = 11;
  optional bool last_complete = 12;
  // What the last read did, or why it failed.
  optional string last_note = 13;
  // How a career page was read: "feed https://…", "greenhouse board gitlab", "listing recipe".
  optional string resolved = 14;
  SearchStats stats = 15;
  // Why it's watched (the search planner's reason and the web search that found it).
  optional string note = 16;
  // Career pages: its listing recipe (listings only from GetSearchSource).
  optional ListingRecipe recipe = 17;
}

// A career page's listing recipe: written once by reader_builder, run as plain Playwright.
message ListingRecipe {
  // ok (in use) | building (a build is waiting or running) | failed (none could be built yet)
  string status = 1;
  optional google.protobuf.Timestamp built_at = 2;
  // Listings of the last good read.
  optional int32 last_count = 3;
  // What the last build did, or why it's being rebuilt or failed.
  optional string note = 4;
  // How it reads the page, one line per part.
  repeated string description = 5;
  int32 builds = 6;
  // What it read from the page it was built on (the first page).
  repeated RecipeListing listings = 7;
  optional google.protobuf.Timestamp last_sampled_at = 8;
}

message RecipeListing {
  string title = 1;
  string url = 2;
  optional string location = 3;
  optional string team = 4;
}

// One search_planner run.
message SearchPlan {
  int64 id = 1;
  // manual | schedule
  string trigger = 2;
  // queued (waiting or running) | done | failed
  string status = 3;
  google.protobuf.Timestamp started_at = 4;
  optional google.protobuf.Timestamp finished_at = 5;
  // The strategies it added.
  repeated int64 strategy_ids = 6;
  // The sources it added to the watch list.
  repeated string board_keys = 7;
  // The web searches it ran.
  repeated string searches = 8;
  optional string note = 9;
}

message SearchSourceKind {
  string kind = 1;
  string label = 2;
  bool enabled = 3;
  int32 sources = 4;
}

// One source's part of a run.
message SearchRunSource {
  string source_key = 1;
  string label = 2;
  // Listings it returned, and how many the strategy matched.
  int32 listed = 3;
  int32 matched = 4;
  // New postings, and matches that joined a posting already known.
  int32 added = 5;
  int32 attached = 6;
  // Its whole list, read to the end.
  bool complete = 7;
  // Postings closed or reopened by its list, and re-verifications it asked for.
  int32 closed = 8;
  int32 reopened = 9;
  int32 reverify = 10;
  optional string error = 11;
  optional string note = 12;
}

message SearchRun {
  // Also the run_id of every task it spawned (`applyant runs show <id>`).
  int64 id = 1;
  int64 strategy_id = 2;
  string strategy_name = 3;
  // schedule | wake (missed while the Mac slept) | manual
  string trigger = 4;
  // queued (waiting or running) | done | failed
  string status = 5;
  google.protobuf.Timestamp started_at = 6;
  optional google.protobuf.Timestamp finished_at = 7;
  int32 listed = 8;
  int32 added = 9;
  repeated SearchRunSource sources = 10;
  optional string note = 11;
}

message ListSearchRequest {}

message ListSearchResponse {
  repeated SearchStrategy strategies = 1;
  repeated SearchSource sources = 2;
  repeated SearchSourceKind kinds = 3;
  // The latest planner runs, newest first.
  repeated SearchPlan plans = 4;
}

message AddStrategyRequest {
  string name = 1;
  repeated string queries = 2;
  repeated string locations = 3;
  repeated string sources = 4;
  // 0: every 6 hours. At least 60.
  int32 every_minutes = 5;
  // Added paused: it doesn't run until resumed.
  bool paused = 6;
}

message AddStrategyResponse {
  SearchStrategy strategy = 1;
  // The run it started, unless paused.
  optional int64 run_id = 2;
}

message StringList {
  repeated string values = 1;
}

message UpdateStrategyRequest {
  // Id or name.
  string strategy = 1;
  optional string name = 2;
  // Set to replace (an empty list clears queries / locations).
  optional StringList queries = 3;
  optional StringList locations = 4;
  optional StringList sources = 5;
  optional int32 every_minutes = 6;
  // active | paused
  optional string state = 7;
}

message UpdateStrategyResponse {
  SearchStrategy strategy = 1;
}

message DeleteStrategyRequest {
  string strategy = 1;
}

message DeleteStrategyResponse {}

message RunStrategyRequest {
  string strategy = 1;
}

message RunStrategyResponse {
  SearchStrategy strategy = 1;
  // Unset when a run was already waiting or running.
  optional int64 run_id = 2;
}

message AddSearchSourceRequest {
  // greenhouse | ashby | lever | workable | board | page; empty: `locator` is a URL (a board's
  // own page becomes that board, anything else a career page / feed).
  string kind = 1;
  // Board token / slug / site / account, a board id (hn, remoteok, …) or a URL.
  string locator = 2;
  optional string label = 3;
}

message AddSearchSourceResponse {
  SearchSource source = 1;
  bool created = 2;
}

message SetSearchSourceEnabledRequest {
  // A source key (board:hn), id or unique locator, or a kind (greenhouse, board, …).
  string target = 1;
  bool enabled = 2;
}

message SetSearchSourceEnabledResponse {
  // The kind that was switched, when the target was a kind.
  optional SearchSourceKind kind = 1;
  repeated SearchSource sources = 2;
}

message ListSearchRunsRequest {
  // Only this strategy's runs (id or name).
  optional string strategy = 1;
  // 0 means 20.
  int32 limit = 2;
}

message ListSearchRunsResponse {
  repeated SearchRun runs = 1;
}

message PlanSearchRequest {}

message PlanSearchResponse {
  // Unset when a planner run was already waiting or running.
  optional int64 plan_id = 1;
}

message GetSearchSourceRequest {
  // A source key (page:https://…), id or unique locator.
  string source = 1;
}

message GetSearchSourceResponse {
  SearchSource source = 1;
}

message RebuildRecipeRequest {
  string source = 1;
}

message RebuildRecipeResponse {
  // False when a build was already waiting or running.
  bool queued = 1;
  SearchSource source = 2;
}

// ---- Model roles --------------------------------------------------------------------------

message RoleRoute {
  string role = 1;
  // "claude:sonnet", "codex", "jev", …
  string route = 2;
  string default_route = 3;
  // Set by the candidate (not the default).
  bool overridden = 4;
  // Where a jev decision goes when Jev is off or unsure.
  optional string fallback = 5;
  string description = 6;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated RoleRoute roles = 1;
}

message SetRoleRequest {
  string role = 1;
  // provider[:model]: claude | codex | jev | apple, e.g. "codex" or "claude:opus".
  string route = 2;
}

message SetRoleResponse {
  RoleRoute role = 1;
}

message ResetRolesRequest {
  // Unset: every role.
  optional string role = 1;
}

message ResetRolesResponse {
  // The roles that went back to their defaults.
  repeated string roles = 1;
}

// ---- Companies ------------------------------------------------------------------------------

message CompanyFinding {
  string text = 1;
  // YYYY-MM or YYYY-MM-DD, when it matters.
  optional string date = 2;
  // The pages that say it.
  repeated string sources = 3;
}

message CompanySection {
  // product | funding | size | founders | stack | news | layoffs | reviews | remote | salary
  string key = 1;
  // "Product", "Funding", …
  string label = 2;
  repeated CompanyFinding findings = 3;
}

message CompanyRedFlag {
  // layoffs | reviews | outstaffing | pay | funding | legal | other
  string kind = 1;
  // low | medium | high
  string severity = 2;
  string text = 3;
  repeated string sources = 4;
}

message CompanyPosting {
  int64 id = 1;
  optional string title = 2;
  optional int32 score = 3;
  PostingStage stage = 4;
}

message Company {
  int64 id = 1;
  string name = 2;
  // queued (waiting or running) | done | failed (the last attempt; an older profile is kept)
  string status = 3;
  // Research is waiting or running now.
  bool researching = 4;
  // The profile is younger than 30 days.
  bool fresh = 5;
  // prepare | manual: who asked last.
  string trigger = 6;
  optional string website = 7;
  // Two to four sentences on what the company does; unset until researched.
  optional string summary = 8;
  repeated CompanyRedFlag red_flags = 9;
  // Only filled by GetCompany: every section with its findings and sources.
  repeated CompanySection sections = 10;
  optional google.protobuf.Timestamp researched_at = 11;
  optional google.protobuf.Timestamp attempted_at = 12;
  // What the researcher couldn't find, or why research failed.
  optional string note = 13;
  // Its postings (by name), newest first.
  repeated CompanyPosting postings = 14;
  // How many findings the profile has.
  int32 findings = 15;
}

message ListCompaniesRequest {}

message ListCompaniesResponse {
  repeated Company companies = 1;
}

message GetCompanyRequest {
  oneof target {
    // An id or a name.
    string company = 1;
    int64 posting_id = 2;
  }
}

message GetCompanyResponse {
  // Unset when the company has never been researched.
  optional Company company = 1;
}

message ResearchCompanyRequest {
  oneof target {
    // An id or a name.
    string company = 1;
    // The posting's company.
    int64 posting_id = 2;
  }
  // Research again even when the profile is fresh.
  bool refresh = 3;
}

message ResearchCompanyResponse {
  Company company = 1;
  // False when research was already waiting or running, or the profile is fresh.
  bool queued = 2;
}

message Mailbox {
  // gmail | imap
  string kind = 1;
  // Empty while Google's consent is still open.
  string address = 2;
  // connecting | connected | failed
  string status = 3;
  optional google.protobuf.Timestamp synced_at = 4;
  // Why connecting or the last sync failed.
  optional string note = 5;
  // Emails waiting in the ask queue.
  int32 asking = 6;
  // What it was connected with, never a password or secret (to reconnect with the same).
  // Gmail: the OAuth client id.
  optional string client_id = 7;
  // IMAP: the servers, TLS and the login when it isn't the address.
  optional string imap_host = 8;
  int32 imap_port = 9;
  optional string smtp_host = 10;
  int32 smtp_port = 11;
  bool secure = 12;
  optional string username = 13;
}

message ImapSettings {
  string imap_host = 1;
  // 0 means 993 (143 when not secure).
  int32 imap_port = 2;
  string smtp_host = 3;
  // 0 means 465 (587 when not secure).
  int32 smtp_port = 4;
  // TLS from the start; false uses STARTTLS where offered. Ports 993/465 always start with TLS
  // and 143/587/25 always use STARTTLS; this decides for other ports and the default ports
  // (993 + 465, or 143 + 587).
  bool secure = 5;
  // When the login isn't the address.
  optional string username = 6;
  // An app password; stored in Secrets, never returned.
  string password = 7;
}

message GmailSettings {
  // The owner's "Desktop app" OAuth client; config / APPLYANT_GOOGLE_CLIENT_ID when unset.
  optional string client_id = 1;
  // Stored in Secrets.
  optional string client_secret = 2;
}

message ConnectMailboxRequest {
  string address = 1;
  oneof kind {
    GmailSettings gmail = 2;
    ImapSettings imap = 3;
  }
}

message ConnectMailboxResponse {
  Mailbox mailbox = 1;
  // Gmail: open this in the browser to give consent.
  optional string auth_url = 2;
}

message GetMailboxRequest {}

message GetMailboxResponse {
  // Unset when no mailbox is connected.
  optional Mailbox mailbox = 1;
  // A Google client secret is stored (the value never leaves the daemon).
  bool google_client_secret_stored = 2;
  // The client id to offer: the mailbox's, else config's (APPLYANT_GOOGLE_CLIENT_ID).
  optional string google_client_id = 3;
}

message DisconnectMailboxRequest {}

message DisconnectMailboxResponse {
  // False when no mailbox was connected.
  bool disconnected = 1;
}

message SyncMailboxRequest {}

message SyncMailboxResponse {
  // False when a sync was already waiting or running.
  bool queued = 1;
}

message MailCandidate {
  int64 application_id = 1;
  optional string title = 2;
  optional string company = 3;
  ApplicationStage stage = 4;
}

message Email {
  int64 id = 1;
  string from_address = 2;
  optional string from_name = 3;
  string subject = 4;
  // The start of the text.
  string snippet = 5;
  google.protobuf.Timestamp received_at = 6;
  // rejection | interview | offer | acknowledgement | security_code | other | unknown
  string label = 7;
  optional double confidence = 8;
  // The route that classified it ("apple", "claude:haiku"); unset when nothing could.
  optional string classified_by = 9;
  optional int64 application_id = 10;
  // matched | ask | assigned
  string status = 11;
  // Why it was matched, or why it's asked about.
  optional string note = 12;
  // Applications it may belong to, best first.
  repeated MailCandidate candidates = 13;
  // An interview invite's start, as its calendar attachment gave it (RFC 3339 local time with
  // `invite_time_zone`, RFC 3339 UTC, or a date).
  optional string invite_start = 14;
  optional string invite_time_zone = 15;
  // The Google Calendar event made for it: created | cancelled | skipped.
  optional string calendar_status = 16;
  optional string calendar_link = 17;
  // Why there's no event (skipped).
  optional string calendar_note = 18;
}

message ListMailQueueRequest {}

message ListMailQueueResponse {
  repeated Email emails = 1;
}

message AssignEmailRequest {
  int64 email_id = 1;
  // Unset: the email isn't about any application.
  optional int64 application_id = 2;
  // What the email is, when the classifier couldn't tell (rejection | interview | offer | ...).
  optional string label = 3;
}

message AssignEmailResponse {
  Email email = 1;
}

// ---- Guarded platforms (phase 14) -----------------------------------------------------------

message Platform {
  // linkedin | xing
  string platform = 1;
  string name = 2;
  int32 searches_per_day = 3;
  int32 applications_per_day = 4;
  // In the last 24 hours.
  int32 searches_today = 5;
  int32 applications_today = 6;
  optional google.protobuf.Timestamp paused_at = 7;
  optional string pause_reason = 8;
  optional google.protobuf.Timestamp signed_in_at = 9;
}

message ListPlatformsRequest {}

message ListPlatformsResponse {
  repeated Platform platforms = 1;
  // A CapMonster key is stored: captchas off LinkedIn/Xing are solved before any hand-off.
  bool captcha_solver = 2;
  // The sign-in window is open (at this URL).
  optional string sign_in_open = 3;
}

message SetPlatformCapsRequest {
  string platform = 1;
  optional int32 searches_per_day = 2;
  optional int32 applications_per_day = 3;
}

message SetPlatformCapsResponse {
  Platform platform = 1;
}

message ResumePlatformRequest {
  string platform = 1;
}

message ResumePlatformResponse {
  Platform platform = 1;
}

message SignInRequest {
  // linkedin | xing | an https URL (a Workday tenant, Djinni…).
  string target = 1;
  // Close hand-off windows left open in Applyant's browser (their filled forms are lost).
  bool force = 2;
}

message SignInResponse {
  string url = 1;
  // The guarded platform the URL belongs to, if any.
  optional string platform = 2;
}

enum TelegramState {
  TELEGRAM_STATE_UNSPECIFIED = 0;
  TELEGRAM_STATE_DISCONNECTED = 1;
  // A code was sent to the account's Telegram apps (or by SMS).
  TELEGRAM_STATE_WAITING_CODE = 2;
  // The account has two-step verification: its password is next.
  TELEGRAM_STATE_WAITING_PASSWORD = 3;
  TELEGRAM_STATE_CONNECTED = 4;
}

message Telegram {
  TelegramState state = 1;
  // "@handle · Name" once connected.
  optional string account = 2;
  // The app credentials from my.telegram.org are stored (api id + hash).
  bool api_configured = 3;
  // Why the last sign-in failed, or the 2FA password's hint.
  optional string note = 4;
}

message GetTelegramRequest {}

message GetTelegramResponse {
  Telegram telegram = 1;
}

message ConnectTelegramRequest {
  oneof step {
    // Starts signing in (stores api_id / api_hash first when given).
    ConnectTelegramStart start = 1;
    string code = 2;
    string password = 3;
    // Stops a sign-in that is waiting.
    bool cancel = 4;
  }
}

message ConnectTelegramStart {
  string phone = 1;
  optional string api_id = 2;
  optional string api_hash = 3;
}

message ConnectTelegramResponse {
  Telegram telegram = 1;
}

message DisconnectTelegramRequest {}

message DisconnectTelegramResponse {
  Telegram telegram = 1;
}

// ---- Overview --------------------------------------------------------------------------

enum OverviewWindow {
  // Same as OVERVIEW_WINDOW_30_DAYS.
  OVERVIEW_WINDOW_UNSPECIFIED = 0;
  OVERVIEW_WINDOW_7_DAYS = 1;
  OVERVIEW_WINDOW_30_DAYS = 2;
  OVERVIEW_WINDOW_ALL = 3;
}

message GetOverviewRequest {
  OverviewWindow window = 1;
}

// One funnel step: postings first seen in the window that reached it.
message FunnelStep {
  // found | verified | interested | prepared | approved | applied | interview | offer
  string key = 1;
  string label = 2;
  int64 count = 3;
}

// A share: numerator of denominator (the ratio is unset while the denominator is 0).
message OverviewRatio {
  int64 numerator = 1;
  int64 denominator = 2;
  optional double ratio = 3;
}

message OverviewMetric {
  // live_forms | interested | review_time | unsupported_claims | applications_per_week |
  // interview_rate
  string key = 1;
  string label = 2;
  // What it measures, in a sentence.
  string definition = 3;
  // The target as the PRD states it ("≥ 95%"); empty for the funnel's watched numbers.
  string target = 4;
  // The value as shown ("96% · 24 of 25", "12 min median · 3 reviews", "—" with no data).
  string display = 5;
  // Set when there's data: whether the target holds (unset for numbers without a target).
  optional bool met = 6;
  // The value itself: a share (0–1), minutes, a count or a rate per week.
  optional double value = 7;
  optional OverviewRatio ratio = 8;
}

message GetOverviewResponse {
  OverviewWindow window = 1;
  // The window's start; unset for all time.
  optional google.protobuf.Timestamp since = 2;
  repeated FunnelStep funnel = 3;
  repeated OverviewMetric metrics = 4;
}
